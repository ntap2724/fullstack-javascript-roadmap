name: Engineering task
description: Define a bounded engineering change and its evidence requirements.
title: '[Engineering]: '
labels:
  - engineering
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State the outcome this task must achieve.
    validations:
      required: true
  - type: textarea
    id: in_scope
    attributes:
      label: In scope
      description: List the behavior and artifacts this task may change.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: List related work this task must not change.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      description: Select the highest risk level that applies.
      options:
        - R0 — text or obvious link correction
        - R1 — lesson or focused exercise
        - R2 — package logic or website behavior
        - R3 — schema, graph, or template publisher
        - R4 — authentication, publication, or release tooling
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: List observable conditions that demonstrate completion.
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands
      description: List the commands required to verify this task.
      placeholder: |
        pnpm check
        pnpm verify
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Record expected outputs, exits, or review artifacts.
    validations:
      required: true
