schemaVersion: 1
id: template-minimal
repositoryName: minimal-template
version: 0.1.0
curriculum:
  release: 0.2.0
  entryPoint: project-minimal-baseline
runtime:
  nodeFamily: 24
  packageManager: pnpm
publication:
  include:
    - files/**
  exclude:
    - files/**/solution/**
    - files/**/private-fixtures/**
    - files/**/*.internal.*
  textTransforms:
    - token: '{{TEMPLATE_VERSION}}'
      valueFrom: template.version
    - token: '{{CURRICULUM_VERSION}}'
      valueFrom: curriculum.release
verification:
  install:
    command: pnpm
    args: [install, --frozen-lockfile]
    cwd: .
    timeoutMs: 180000
  baseline:
    command: pnpm
    args: [verify:baseline]
    cwd: .
    timeoutMs: 180000
